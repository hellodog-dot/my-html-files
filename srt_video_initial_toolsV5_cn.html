<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRT视频初始校对工具V5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #f5f8fb;
            --card: #fff;
            --line: #dbe3ec;
            --text: #1f2a35;
            --sub: #5f6f80;
            --primary: #1f7a8d;
            --primary-2: #2e98a7;
            --ok: #1f8f5f;
            --warn: #bf7c11;
            --err: #c33f33;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 100% -10%, #d9eee8 0%, transparent 35%),
                radial-gradient(circle at -10% 110%, #dfeaf8 0%, transparent 35%),
                var(--bg);
        }
        .wrap { max-width: 1280px; margin: 24px auto 40px; padding: 0 14px; }
        .hero {
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            padding: 16px 20px;
            box-shadow: 0 10px 24px rgba(31, 122, 141, 0.2);
        }
        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .hero h1 { margin: 0 0 6px; font-size: 24px; }
        .hero p { margin: 0; font-size: 13px; opacity: 0.95; }
        .hero .btn.guide {
            background: #ffffff;
            color: #155664;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 12px;
            font-size: 13px;
        }
        .hero .btn.guide:hover { background: #eef8fb; color: #0f4b58; }

        .card {
            margin-top: 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(10, 30, 55, 0.05);
        }
        .card h2 { margin: 0 0 12px; font-size: 18px; }
        .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; align-items: end; }
        .field { grid-column: span 12; }
        .half { grid-column: span 6; }
        .third { grid-column: span 4; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--sub); font-weight: 600; }

        input[type="file"], input[type="number"], textarea, select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 14px;
            outline: none;
            background: #fff;
            color: var(--text);
        }
        textarea {
            min-height: 88px;
            resize: vertical;
            line-height: 1.45;
            font-family: "Consolas", "SFMono-Regular", monospace;
        }
        .hint { margin-top: 4px; font-size: 12px; color: var(--sub); }
        .row-inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
        .badge {
            display: inline-block;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 4px 8px;
            background: #f8fbfd;
            color: #35505b;
            font-size: 12px;
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
            transition: background 0.2s ease, transform 0.05s ease;
        }
        .btn:hover { background: var(--primary-2); }
        .btn:active { transform: translateY(1px); }
        .btn.warn { background: #c17a12; }
        .btn.warn:hover { background: #a5670f; }
        .btn.secondary { background: #607988; }
        .btn.secondary:hover { background: #4f6674; }
        #runRepairBtn { color: #111; }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .progress {
            margin-top: 8px;
            width: 100%;
            height: 12px;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid #d5dfe8;
            background: #ecf2f6;
            display: none;
        }
        .progress > div {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #1f7a8d, #47a5af);
            transition: width 0.2s ease;
        }

        .summary {
            margin: 8px 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            background: #f8fcfd;
            font-size: 14px;
        }
        .ok { color: var(--ok); font-weight: 700; }
        .warn { color: var(--warn); font-weight: 700; }
        .err { color: var(--err); font-weight: 700; }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            word-break: break-word;
            font-size: 13px;
        }
        th, td {
            border: 1px solid var(--line);
            padding: 7px 8px;
            text-align: left;
            vertical-align: top;
        }
        th { background: #edf4f8; }
        .pill {
            display: inline-block;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .pill.ok { background: #dff4e9; color: #1d8a5b; }
        .pill.err { background: #fde8e5; color: #b8372d; }
        .pill.warn { background: #fff1da; color: #a96909; }

        .checks {
            border: 1px dashed #c8d8e2;
            border-radius: 10px;
            padding: 10px;
            background: #fbfeff;
        }
        .checks label { margin: 6px 0; color: var(--text); font-weight: 500; }
        .hidden { display: none; }

        .tabbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; }
        .tabbtn {
            border: 1px solid #cad8e3;
            border-radius: 999px;
            padding: 6px 10px;
            background: #f4f9fc;
            color: #35535f;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }
        .tabbtn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .issue-card {
            border: 1px solid var(--line);
            border-left: 4px solid #c7811c;
            border-radius: 10px;
            background: #fffdfa;
            padding: 10px;
            margin-bottom: 8px;
        }
        .issue-card.error { border-left-color: var(--err); background: #fff8f7; }
        .issue-file { font-weight: 700; margin-bottom: 6px; }
        .issue-title { margin: 6px 0; font-weight: 700; color: #324955; }
        .mono { font-family: "Consolas", "SFMono-Regular", monospace; font-size: 12px; margin: 6px 0; }
        pre.block {
            margin: 6px 0 10px;
            border: 1px solid #dbe6e3;
            border-radius: 8px;
            padding: 8px 10px;
            background: #fafdfd;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            font-family: "Consolas", "SFMono-Regular", monospace;
            font-size: 12px;
        }

        .repair-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; align-items: center; margin-top: 10px; }
        .repair-item { grid-column: span 6; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fafcfe; }
        .repair-item .status { font-size: 12px; color: var(--sub); }
        .unsupported { margin-top: 8px; font-size: 12px; color: var(--sub); }

        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(20, 30, 40, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 999;
        }
        .modal {
            width: min(980px, 100%);
            max-height: 88vh;
            overflow: auto;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #d8e2ec;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 14px;
        }
        .modal-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 10px; }
        .modal h3 { margin: 0; font-size: 18px; }

        @media (max-width: 900px) {
            .half, .third, .repair-item { grid-column: span 12; }
            .hero-top { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <div class="hero-top">
                <h1>SRT + 视频初始校对工具 V5</h1>
                <button id="openGuideBtn" type="button" class="btn guide">功能说明</button>
            </div>
            <p>通用纯净版，不保留缓存，支持6项检查，标签页仅显示有问题集数，仅支持在线修复 #2 与 #4。</p>
        </div>
        <div id="bootStatus" class="summary"><span class="warn">启动状态：等待脚本初始化...</span></div>

        <section class="card">
            <h2>1）视频对比检查</h2>
            <div class="grid">
                <div class="field half">
                    <label for="videoWithInput">有字幕视频文件夹（可多选）</label>
                    <input id="videoWithInput" type="file" multiple webkitdirectory directory accept="video/*,.mp4,.mov,.mkv" />
                    <div class="hint">已选择：<span id="videoWithCount">0</span> 个文件</div>
                </div>
                <div class="field half">
                    <label for="videoWithoutInput">无字幕视频文件夹（可多选）</label>
                    <input id="videoWithoutInput" type="file" multiple webkitdirectory directory accept="video/*,.mp4,.mov,.mkv" />
                    <div class="hint">已选择：<span id="videoWithoutCount">0</span> 个文件</div>
                </div>
                <div class="field third">
                    <label for="expectWidth">期望宽度（可选）</label>
                    <input id="expectWidth" type="number" min="1" value="1080" placeholder="e.g. 1920" />
                </div>
                <div class="field third">
                    <label for="expectHeight">期望高度（可选）</label>
                    <input id="expectHeight" type="number" min="1" value="1920" placeholder="e.g. 1080" />
                </div>
                <div class="field third">
                    <label for="durationTolerance">时长容差（秒）</label>
                    <input id="durationTolerance" type="number" min="0" step="0.01" value="0.03" />
                    <div class="hint">时长比较按毫秒精度，显示为时分秒.毫秒。</div>
                </div>
            </div>
            <div class="row-inline">
                <button id="runVideoBtn" class="btn">开始视频检查</button>
                <span class="badge">集数配对 + MP4格式 + 分辨率 + 时长检查</span>
            </div>
            <div class="progress" id="videoProgressWrap"><div id="videoProgressBar"></div></div>
            <div id="videoResults"></div>
        </section>

        <section class="card">
            <h2>2）SRT检查与修复</h2>
            <div class="grid">
                <div class="field half">
                    <label for="srtInput">上传SRT文件（可多选/文件夹）</label>
                    <input id="srtInput" type="file" multiple webkitdirectory directory accept=".srt,text/plain" />
                    <div class="hint">已选择：<span id="srtCount">0</span> 个 .srt 文件</div>
                </div>
            </div>

            <div class="checks">
                <div class="hint">开始前请至少勾选一项检查：</div>
                <label><input id="checkSensitive" type="checkbox" /> 1）敏感词检查</label>
                <label><input id="checkOverHour" type="checkbox" /> 2）超1小时时间轴检查</label>
                <label><input id="checkDup" type="checkbox" /> 3）相邻重复字幕检查</label>
                <label><input id="checkSymbol" type="checkbox" /> 4）多余符号检查</label>
                <label><input id="checkBlank" type="checkbox" /> 5）空白字幕行检查</label>
                <label><input id="checkSrtVsVideo" type="checkbox" /> 6）SRT时长大于有字幕视频</label>
            </div>

            <div id="sensitiveInputWrap" class="field hidden" style="margin-top:10px;">
                <label for="sensitiveWordsInput">敏感词词库（在线输入）</label>
                <textarea id="sensitiveWordsInput" placeholder="每行一个词，例如：小可爱、女人、男人"></textarea>
            </div>

            <div id="symbolInputWrap" class="field hidden" style="margin-top:10px;">
                <label for="symbolWordsInput">多余符号（在线输入）</label>
                <textarea id="symbolWordsInput" placeholder="每行一个符号，例如：{\b1}、{\b}、&lt;b&gt;、&lt;/b&gt;"></textarea>
            </div>

            <div class="row-inline">
                <button id="runSrtBtn" type="button" class="btn" onclick="if(window.__runSrtCheck){window.__runSrtCheck();}else{var b=document.getElementById('srtSummary'); if(b){b.innerHTML='<div class=&quot;summary&quot;><span class=&quot;err&quot;>初始化失败：运行函数未就绪。</span></div>';}}">开始SRT检查</button>
            </div>

            <div id="srtSummary"></div>
            <div id="srtTabWrap"></div>

            <div class="repair-grid">
                <div class="repair-item">
                    <label><input id="repairOverHour" type="checkbox" /> 修复 #2 超1小时</label>
                    <div class="status" id="repairOverHourStatus">状态：未修复</div>
                </div>
                <div class="repair-item">
                    <label><input id="repairSymbol" type="checkbox" /> 修复 #4 多余符号</label>
                    <div class="status" id="repairSymbolStatus">状态：未修复</div>
                </div>
            </div>

            <div class="unsupported">当前版本暂不支持 #1 #3 #5 #6 在线修复。</div>

            <div class="row-inline">
                <button id="runRepairBtn" type="button" class="btn warn">开始修复</button>
                <button id="downloadFixedBtn" type="button" class="btn secondary" disabled>下载已修复SRT</button>
            </div>
            <div id="fixedList"></div>
        </section>
    </div>

    <div class="modal-mask" id="modalMask">
        <div class="modal">
            <div class="modal-top">
                <h3 id="modalTitle">明细</h3>
                <button class="btn secondary" id="modalCloseBtn">关闭</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const state = {
            withVideos: [],
            withoutVideos: [],
            withVideoInfos: [],
            withVideoByEpisode: new Map(),
            srtFiles: [],
            analyses: [],
            fixedFiles: [],
            zipSessionCounterByDate: {},
            isSrtChecking: false
        };

        const el = {
            videoWithInput: document.getElementById("videoWithInput"),
            videoWithoutInput: document.getElementById("videoWithoutInput"),
            videoWithCount: document.getElementById("videoWithCount"),
            videoWithoutCount: document.getElementById("videoWithoutCount"),
            expectWidth: document.getElementById("expectWidth"),
            expectHeight: document.getElementById("expectHeight"),
            durationTolerance: document.getElementById("durationTolerance"),
            runVideoBtn: document.getElementById("runVideoBtn"),
            videoProgressWrap: document.getElementById("videoProgressWrap"),
            videoProgressBar: document.getElementById("videoProgressBar"),
            videoResults: document.getElementById("videoResults"),
            srtInput: document.getElementById("srtInput"),
            srtCount: document.getElementById("srtCount"),
            checkSensitive: document.getElementById("checkSensitive"),
            checkOverHour: document.getElementById("checkOverHour"),
            checkDup: document.getElementById("checkDup"),
            checkSymbol: document.getElementById("checkSymbol"),
            checkBlank: document.getElementById("checkBlank"),
            checkSrtVsVideo: document.getElementById("checkSrtVsVideo"),
            sensitiveInputWrap: document.getElementById("sensitiveInputWrap"),
            symbolInputWrap: document.getElementById("symbolInputWrap"),
            sensitiveWordsInput: document.getElementById("sensitiveWordsInput"),
            symbolWordsInput: document.getElementById("symbolWordsInput"),
            runSrtBtn: document.getElementById("runSrtBtn"),
            openGuideBtn: document.getElementById("openGuideBtn"),
            srtSummary: document.getElementById("srtSummary"),
            srtTabWrap: document.getElementById("srtTabWrap"),
            repairOverHour: document.getElementById("repairOverHour"),
            repairSymbol: document.getElementById("repairSymbol"),
            repairOverHourStatus: document.getElementById("repairOverHourStatus"),
            repairSymbolStatus: document.getElementById("repairSymbolStatus"),
            runRepairBtn: document.getElementById("runRepairBtn"),
            downloadFixedBtn: document.getElementById("downloadFixedBtn"),
            fixedList: document.getElementById("fixedList"),
            modalMask: document.getElementById("modalMask"),
            modalTitle: document.getElementById("modalTitle"),
            modalBody: document.getElementById("modalBody"),
            modalCloseBtn: document.getElementById("modalCloseBtn")
        };

        function esc(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function parseNumber(value, fallback = 0) {
            const n = Number(value);
            return Number.isFinite(n) ? n : fallback;
        }

        function filterVideoFiles(list) {
            return Array.from(list || []).filter((f) => /\.(mp4|mov|mkv|m4v|avi|wmv|flv)$/i.test(f.name) || (f.type && f.type.startsWith("video/")));
        }

        function filterSrtFiles(list) {
            return Array.from(list || []).filter((f) => /\.srt$/i.test(f.name));
        }

        function dedupeFiles(files) {
            const seen = new Set();
            const out = [];
            for (const f of files || []) {
                const rel = f && f.webkitRelativePath ? f.webkitRelativePath : "";
                const key = `${f.name}__${f.size}__${f.lastModified}__${rel}`;
                if (seen.has(key)) continue;
                seen.add(key);
                out.push(f);
            }
            return out;
        }

        function setProgress(progress01) {
            const p = Math.max(0, Math.min(1, progress01));
            el.videoProgressWrap.style.display = "block";
            el.videoProgressBar.style.width = `${Math.round(p * 100)}%`;
        }

        function hideProgress() {
            el.videoProgressBar.style.width = "0%";
            el.videoProgressWrap.style.display = "none";
        }

        function toTimecode(ms) {
            const safe = Math.max(0, Math.floor(ms));
            const h = Math.floor(safe / 3600000);
            const m = Math.floor((safe % 3600000) / 60000);
            const s = Math.floor((safe % 60000) / 1000);
            const t = safe % 1000;
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")},${String(t).padStart(3, "0")}`;
        }

        function toHms(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return "00:00:00.000";
            const totalMs = Math.round(seconds * 1000);
            const h = Math.floor(totalMs / 3600000);
            const m = Math.floor((totalMs % 3600000) / 60000);
            const s = Math.floor((totalMs % 60000) / 1000);
            const t = totalMs % 1000;
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(t).padStart(3, "0")}`;
        }

        function formatMinutes(ms) {
            return (ms / 60000).toFixed(2);
        }

        function extractEpisodeKey(fileName) {
            const base = fileName.replace(/\.[^.]+$/, "");
            const clean = base.replace(/[_\-.]/g, " ").trim();
            let m = clean.match(/\b(?:EP|Ep|ep|E)\s*0*(\d{1,4})\b/);
            if (m) return String(parseInt(m[1], 10));
            m = clean.match(/(^|[^\d])0*(\d{1,4})(?=[^\d]|$)/);
            if (m) return String(parseInt(m[2], 10));
            return clean.toLowerCase().replace(/\s+/g, "") || base.toLowerCase();
        }

        function parseWordList(raw) {
            return Array.from(new Set(
                String(raw || "")
                    .split(/[\r\n,;\uFF0C\uFF1B]+/)
                    .map((s) => s.trim())
                    .filter(Boolean)
            ));
        }

        function showModal(title, html) {
            el.modalTitle.textContent = title;
            el.modalBody.innerHTML = html;
            el.modalMask.style.display = "flex";
        }

        function closeModal() {
            el.modalMask.style.display = "none";
            el.modalBody.innerHTML = "";
        }

        function openFeatureGuide() {
            const html = [];
            html.push(`<div class="summary">本页面用于视频与SRT的初步校对，支持检查、定位问题与部分自动修复。</div>`);
            html.push(`<div class="issue-card"><div class="issue-title">一、视频对比检查</div><ul><li>有字幕/无字幕视频按集数配对检查。</li><li>支持数量一致性、MP4格式校验、分辨率一致性、时长差异校验（含容差）。</li><li>可设置期望宽高（例如1080x1920），不一致即标记异常。</li><li>结果表格展示每集真实时长、分辨率、扩展名与错误原因。</li></ul></div>`);
            html.push(`<div class="issue-card"><div class="issue-title">二、SRT检查（支持多选）</div><ul><li>1）敏感词检查：在线输入词库，命中后按集展示明细。</li><li>2）超1小时时间轴检查：定位超过1小时的字幕条目。</li><li>3）相邻重复检查：对相邻字幕做相似度/包含关系判断并展示明细。</li><li>4）多余符号检查：在线输入符号词库并定位命中条目。</li><li>5）空白字幕行检查：检测有时间轴但无字幕文本的条目。</li><li>6）SRT时长大于视频时长：与有字幕视频串联比对，不匹配视频时标记“未匹配跳过”。</li></ul></div>`);
            html.push(`<div class="issue-card"><div class="issue-title">三、结果展示规则</div><ul><li>统计区展示每项命中集数。</li><li>Tab仅显示有问题的项；每个Tab仅显示有问题的集数。</li><li>集数按自然顺序展示（1,2,3...11），不是字符串顺序（1,11,2...）。</li><li>敏感词/多余符号/空白字幕行/超1小时/相邻重复均可点击“查看明细”弹窗。</li></ul></div>`);
            html.push(`<div class="issue-card"><div class="issue-title">四、修复与下载</div><ul><li>支持在线修复：#2 超1小时、#4 多余符号。</li><li>不支持在线修复：#1 #3 #5 #6（仅定位）。</li><li>单集直接下载；多集自动打包ZIP下载。</li><li>ZIP命名按“当天+会话内序号”递增。</li></ul></div>`);
            showModal("SRT + 视频初始校对工具V5 - 功能说明", html.join(""));
        }

        function resetSrtResultArea() {
            state.analyses = [];
            state.fixedFiles = [];
            el.srtSummary.innerHTML = "";
            el.srtTabWrap.innerHTML = "";
            el.fixedList.innerHTML = "";
            el.downloadFixedBtn.disabled = true;
            el.repairOverHourStatus.textContent = "状态：未修复";
            el.repairSymbolStatus.textContent = "状态：未修复";
        }

        function updateDynamicInputVisibility() {
            el.sensitiveInputWrap.classList.toggle("hidden", !el.checkSensitive.checked);
            el.symbolInputWrap.classList.toggle("hidden", !el.checkSymbol.checked);
        }

        function loadVideoMeta(file) {
            return new Promise((resolve) => {
                const video = document.createElement("video");
                const url = URL.createObjectURL(file);
                let done = false;
                const timeout = setTimeout(() => finish({ error: "元数据读取超时" }), 15000);

                function finish(data) {
                    if (done) return;
                    done = true;
                    clearTimeout(timeout);
                    URL.revokeObjectURL(url);
                    resolve(data);
                }

                video.preload = "metadata";
                video.onloadedmetadata = () => {
                    finish({
                        duration: Number(video.duration) || 0,
                        width: Number(video.videoWidth) || 0,
                        height: Number(video.videoHeight) || 0
                    });
                };
                video.onerror = () => finish({ error: "无法读取元数据" });
                video.src = url;
            });
        }

        async function collectVideoInfos(files, startProgress, progressSpan) {
            const out = [];
            const total = Math.max(files.length, 1);
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const meta = await loadVideoMeta(file);
                out.push({
                    file,
                    name: file.name,
                    episodeKey: extractEpisodeKey(file.name),
                    ext: (file.name.split(".").pop() || "").toLowerCase(),
                    isMp4: /\.mp4$/i.test(file.name),
                    duration: meta.duration || 0,
                    width: meta.width || 0,
                    height: meta.height || 0,
                    readError: meta.error || ""
                });
                setProgress(startProgress + ((i + 1) / total) * progressSpan);
            }
            return out;
        }

        function toMapByEpisode(items) {
            const map = new Map();
            for (const item of items) {
                if (!map.has(item.episodeKey)) map.set(item.episodeKey, []);
                map.get(item.episodeKey).push(item);
            }
            return map;
        }

        async function runVideoCheck() {
            if (state.withVideos.length === 0 && state.withoutVideos.length === 0) {
                alert("请先选择视频文件。");
                return;
            }
            el.videoResults.innerHTML = `<div class="summary">正在读取视频元数据...</div>`;
            setProgress(0);

            const expectW = parseNumber(el.expectWidth.value, 0);
            const expectH = parseNumber(el.expectHeight.value, 0);
            const tolerance = parseNumber(el.durationTolerance.value, 0.03);

            const withInfos = await collectVideoInfos(state.withVideos, 0, 0.5);
            const withoutInfos = await collectVideoInfos(state.withoutVideos, 0.5, 0.5);
            hideProgress();

            state.withVideoInfos = withInfos;
            state.withVideoByEpisode = new Map();
            for (const x of withInfos) {
                if (!state.withVideoByEpisode.has(x.episodeKey)) state.withVideoByEpisode.set(x.episodeKey, x);
            }

            const withMap = toMapByEpisode(withInfos);
            const withoutMap = toMapByEpisode(withoutInfos);
            const allKeys = Array.from(new Set([...withMap.keys(), ...withoutMap.keys()]));
            allKeys.sort(compareEpisodeKeyNatural);

            let pairCount = 0;
            let okPairs = 0;
            const duplicateKeys = [];
            const rows = [];

            for (const key of allKeys) {
                const wList = withMap.get(key) || [];
                const nList = withoutMap.get(key) || [];
                if (wList.length > 1 || nList.length > 1) duplicateKeys.push(key);
                const w = wList[0] || null;
                const n = nList[0] || null;
                const issues = [];

                if (!w) issues.push("缺少有字幕视频");
                if (!n) issues.push("缺少无字幕视频");
                if (w && !w.isMp4) issues.push(`有字幕视频非MP4(${w.ext || "未知"})`);
                if (n && !n.isMp4) issues.push(`无字幕视频非MP4(${n.ext || "未知"})`);
                if (w && w.readError) issues.push(`有字幕视频读取失败：${w.readError}`);
                if (n && n.readError) issues.push(`无字幕视频读取失败：${n.readError}`);

                if (w && n) {
                    pairCount += 1;
                    const diff = Math.abs(w.duration - n.duration);
                    if (diff > tolerance) issues.push(`时长差异 ${diff.toFixed(3)}s`);
                    if (w.width && n.width && (w.width !== n.width || w.height !== n.height)) {
                        issues.push(`分辨率不一致 ${w.width}x${w.height} vs ${n.width}x${n.height}`);
                    }
                    if (issues.length === 0) okPairs += 1;
                }

                if (expectW > 0 && expectH > 0) {
                    if (w && (w.width !== expectW || w.height !== expectH)) issues.push(`有字幕视频尺寸不匹配（${expectW}x${expectH}）`);
                    if (n && (n.width !== expectW || n.height !== expectH)) issues.push(`无字幕视频尺寸不匹配（${expectW}x${expectH}）`);
                }

                rows.push({ key, withInfo: w, withoutInfo: n, issues });
            }

            const countMatch = withInfos.length === withoutInfos.length;
            const html = [];
            html.push(`<div class="summary">视频总数：有字幕 <b>${withInfos.length}</b>，无字幕 <b>${withoutInfos.length}</b>，数量一致：${countMatch ? `<span class="ok">是</span>` : `<span class="err">否</span>`}，成功配对：<b>${pairCount}</b>，完全通过：<b>${okPairs}</b></div>`);
            if (duplicateKeys.length > 0) {
                html.push(`<div class="summary"><span class="warn">提示：</span>发现重复集数键：${duplicateKeys.map(esc).join(", ")}</div>`);
            }
            html.push(`<table><thead><tr><th style="width:8%;">集数</th><th style="width:22%;">有字幕文件</th><th style="width:13%;">有字幕信息</th><th style="width:22%;">无字幕文件</th><th style="width:13%;">无字幕信息</th><th style="width:22%;">结果</th></tr></thead><tbody>`);
            for (const row of rows) {
                const w = row.withInfo;
                const n = row.withoutInfo;
                const wMeta = w ? `${toHms(w.duration)} / ${w.width || "-"}x${w.height || "-"} / ${esc(w.ext || "-")}` : "-";
                const nMeta = n ? `${toHms(n.duration)} / ${n.width || "-"}x${n.height || "-"} / ${esc(n.ext || "-")}` : "-";
                const result = row.issues.length === 0 ? `<span class="pill ok">通过</span>` : `<span class="pill err">${esc(row.issues.join("; "))}</span>`;
                html.push(`<tr><td>${esc(row.key)}</td><td>${w ? esc(w.name) : `<span class="pill err">缺失</span>`}</td><td>${wMeta}</td><td>${n ? esc(n.name) : `<span class="pill err">缺失</span>`}</td><td>${nMeta}</td><td>${result}</td></tr>`);
            }
            html.push(`</tbody></table>`);
            el.videoResults.innerHTML = html.join("");
        }

        function readArrayBufferCompat(file, timeoutMs = 15000) {
            const readByArrayBuffer = () => {
                if (file && typeof file.arrayBuffer === "function") return file.arrayBuffer();
                return new Promise((resolve, reject) => {
                    try {
                        const fr = new FileReader();
                        fr.onload = () => resolve(fr.result);
                        fr.onerror = () => reject(fr.error || new Error("文件读取器错误"));
                        fr.readAsArrayBuffer(file);
                    } catch (err) {
                        reject(err);
                    }
                });
            };
            const timeout = new Promise((_, reject) => {
                setTimeout(() => reject(new Error(`读取超时（${timeoutMs}ms）`)), timeoutMs);
            });
            return Promise.race([readByArrayBuffer(), timeout]);
        }

        async function decodeSrtText(file) {
            const buffer = await readArrayBufferCompat(file, 20000);
            const utf8 = new TextDecoder("utf-8", { fatal: false }).decode(buffer);
            const replacement = (utf8.match(/\uFFFD/g) || []).length;
            if (replacement > 0) {
                try {
                    return new TextDecoder("gb18030", { fatal: false }).decode(buffer);
                } catch (e) {
                    return utf8;
                }
            }
            return utf8;
        }

        function parseTimelineLine(line) {
            const m = line.match(/^(\d{2}):(\d{2}):(\d{2}),(\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2}),(\d{3})(.*)$/);
            if (!m) return null;
            const startMs = Number(m[1]) * 3600000 + Number(m[2]) * 60000 + Number(m[3]) * 1000 + Number(m[4]);
            const endMs = Number(m[5]) * 3600000 + Number(m[6]) * 60000 + Number(m[7]) * 1000 + Number(m[8]);
            return { startMs, endMs, suffix: m[9] || "" };
        }

        function buildEntryBlock(seq, timeline, textLines) {
            const lines = [String(seq || "").trim(), String(timeline || "").trim(), ...(textLines || [])]
                .map((x) => String(x || "").trim())
                .filter(Boolean);
            return lines.join("\n");
        }

        function parseSrt(content) {
            const blocks = content
                .replace(/\uFEFF/g, "")
                .split(/\r?\n\r?\n+/)
                .filter((x) => x.trim() !== "");

            const entries = [];
            const invalidBlockSamples = [];

            for (let i = 0; i < blocks.length; i++) {
                const raw = blocks[i];
                const lines = raw.split(/\r?\n/);
                const timelineIdx = lines.findIndex((x) => x.includes("-->"));
                if (timelineIdx < 0) {
                    invalidBlockSamples.push(raw);
                    continue;
                }
                const timelineRaw = lines[timelineIdx].trim();
                const timeline = parseTimelineLine(timelineRaw);
                if (!timeline) {
                    invalidBlockSamples.push(raw);
                    continue;
                }
                const seq = (timelineIdx > 0 ? lines[0] : String(i + 1)).trim();
                const textLines = lines.slice(timelineIdx + 1).map((x) => x.trim()).filter((x) => x.length > 0);
                entries.push({
                    blockIndex: i + 1,
                    sequenceRaw: seq,
                    timelineRaw,
                    startMs: timeline.startMs,
                    endMs: timeline.endMs,
                    suffix: timeline.suffix || "",
                    textLines,
                    text: textLines.join(" ").trim(),
                    rawBlock: buildEntryBlock(seq, timelineRaw, textLines)
                });
            }
            return { entries, invalidBlocks: invalidBlockSamples.length, invalidBlockSamples };
        }

        function normalizeText(text) {
            const source = String(text || "").toLowerCase();
            // Use broadly compatible pattern (avoid \p{} unicode property escapes).
            return source.replace(/[^a-z0-9\u4e00-\u9fff]+/g, "");
        }

        function levenshteinRatio(a, b) {
            if (a === b) return 1;
            if (!a.length || !b.length) return 0;
            const n = a.length;
            const m = b.length;
            const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
            for (let i = 0; i <= n; i++) dp[i][0] = i;
            for (let j = 0; j <= m; j++) dp[0][j] = j;
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    dp[i][j] = Math.min(
                        dp[i - 1][j] + 1,
                        dp[i][j - 1] + 1,
                        dp[i - 1][j - 1] + cost
                    );
                }
            }
            return 1 - dp[n][m] / Math.max(n, m);
        }

        function getEdgeOverlap(a, b, minLen = 2, maxLen = 8) {
            const sa = String(a || "");
            const sb = String(b || "");
            const limit = Math.min(maxLen, sa.length, sb.length);
            let bestText = "";
            let bestType = "";
            for (let len = minLen; len <= limit; len++) {
                const suffixA = sa.slice(-len);
                const prefixB = sb.slice(0, len);
                const suffixB = sb.slice(-len);
                if (suffixA === prefixB && len > bestText.length) {
                    bestText = suffixA;
                    bestType = "suffixPrefix";
                }
                if (suffixA === suffixB && len > bestText.length) {
                    bestText = suffixA;
                    bestType = "suffixSuffix";
                }
            }
            return {
                text: bestText,
                length: bestText.length,
                type: bestType
            };
        }

        function detectAdjacentDuplicates(entries, threshold) {
            const hits = [];
            for (let i = 0; i < entries.length - 1; i++) {
                const a = entries[i];
                const b = entries[i + 1];
                const na = normalizeText(a.text);
                const nb = normalizeText(b.text);
                if (!na || !nb) continue;
                const ratio = levenshteinRatio(na, nb);
                const longer = na.length >= nb.length ? na : nb;
                const shorter = na.length >= nb.length ? nb : na;
                const gap = b.startMs - a.endMs;
                const containsHit = shorter.length >= 4 && longer.includes(shorter) && gap >= 0 && gap <= 2000;
                const edgeOverlap = getEdgeOverlap(na, nb, 2, 8);
                const edgeOverlapHit = edgeOverlap.length >= 2 && gap >= 0 && gap <= 2000;
                if (ratio >= threshold || containsHit || edgeOverlapHit) {
                    let mode = "contains";
                    if (ratio >= threshold) mode = "similarity";
                    else if (edgeOverlapHit) mode = "edgeOverlap";
                    const ratioValue = mode === "edgeOverlap"
                        ? edgeOverlap.length / Math.max(na.length, nb.length)
                        : ratio;
                    hits.push({
                        firstSeq: a.sequenceRaw || String(a.blockIndex),
                        secondSeq: b.sequenceRaw || String(b.blockIndex),
                        firstTimeline: a.timelineRaw,
                        secondTimeline: b.timelineRaw,
                        firstEndMs: a.endMs,
                        secondStartMs: b.startMs,
                        firstTextLines: a.textLines,
                        secondTextLines: b.textLines,
                        firstText: a.text,
                        secondText: b.text,
                        firstBlock: a.rawBlock,
                        secondBlock: b.rawBlock,
                        ratio: ratioValue,
                        mode,
                        overlapText: edgeOverlap.text,
                        overlapType: edgeOverlap.type
                    });
                }
            }
            return hits;
        }

        function detectOverHour(entries) {
            return entries
                .filter((e) => e.startMs >= 3600000 || e.endMs >= 3600000)
                .map((e) => ({
                    seq: e.sequenceRaw || String(e.blockIndex),
                    start: e.startMs,
                    end: e.endMs,
                    timeline: e.timelineRaw,
                    textLines: e.textLines,
                    text: e.text,
                    block: e.rawBlock
                }));
        }

        function detectBlankLines(entries) {
            return entries
                .filter((e) => !e.text || e.text.trim() === "")
                .map((e) => ({
                    seq: e.sequenceRaw || String(e.blockIndex),
                    timeline: e.timelineRaw,
                    block: buildEntryBlock(e.sequenceRaw || String(e.blockIndex), e.timelineRaw, [])
                }));
        }

        function detectSymbols(entries, symbols) {
            if (!symbols.length) return [];
            const hits = [];
            for (const e of entries) {
                const joined = e.textLines.join("\n");
                const matched = symbols.filter((s) => joined.includes(s));
                if (matched.length > 0) {
                    hits.push({
                        seq: e.sequenceRaw || String(e.blockIndex),
                        timeline: e.timelineRaw,
                        matched: Array.from(new Set(matched)),
                        block: e.rawBlock,
                        text: e.text
                    });
                }
            }
            return hits;
        }

        function detectSensitive(entries, words) {
            if (!words.length) return [];
            const lowerWords = words.map((w) => ({ raw: w, lower: w.toLowerCase() }));
            const hits = [];
            for (const e of entries) {
                const text = e.text || "";
                const lowerText = text.toLowerCase();
                const matched = lowerWords.filter((w) => lowerText.includes(w.lower)).map((w) => w.raw);
                if (matched.length > 0) {
                    hits.push({
                        seq: e.sequenceRaw || String(e.blockIndex),
                        timeline: e.timelineRaw,
                        matched: Array.from(new Set(matched)),
                        block: e.rawBlock,
                        text
                    });
                }
            }
            return hits;
        }

        function detectSrtLongerThanVideo(entries, episodeKey) {
            if (!state.withVideoByEpisode.has(episodeKey)) {
                return { skipped: true, reason: "no matched subbed video", items: [] };
            }
            const videoInfo = state.withVideoByEpisode.get(episodeKey);
            const srtMaxEnd = entries.reduce((max, e) => Math.max(max, e.endMs), 0);
            const videoMs = Math.floor((videoInfo.duration || 0) * 1000);
            if (srtMaxEnd > videoMs) {
                return { skipped: false, reason: "", items: [{ srtEndMs: srtMaxEnd, videoMs }] };
            }
            return { skipped: false, reason: "", items: [] };
        }

        function shiftHourInTimelineLine(line) {
            const p = parseTimelineLine(line.trim());
            if (!p) return line;
            let start = p.startMs;
            let end = p.endMs;
            if (start >= 3600000) start -= 3600000;
            if (end >= 3600000) end -= 3600000;
            return `${toTimecode(start)} --> ${toTimecode(end)}${p.suffix || ""}`;
        }

        function fixOverHourInContent(content) {
            const sep = content.includes("\r\n") ? "\r\n" : "\n";
            const lines = content.split(/\r?\n/);
            let changed = 0;
            for (let i = 0; i < lines.length; i++) {
                const p = parseTimelineLine(lines[i].trim());
                if (!p) continue;
                if (p.startMs >= 3600000 || p.endMs >= 3600000) {
                    lines[i] = shiftHourInTimelineLine(lines[i]);
                    changed += 1;
                }
            }
            return { content: lines.join(sep), changed };
        }

        function fixSymbolsInContent(content, symbols) {
            if (!symbols.length) return { content, removed: 0 };
            const sep = content.includes("\r\n") ? "\r\n" : "\n";
            const lines = content.split(/\r?\n/);
            let removed = 0;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (!line || /^\d+\s*$/.test(line.trim()) || parseTimelineLine(line.trim())) continue;
                let next = line;
                for (const token of symbols) {
                    if (!token) continue;
                    const parts = next.split(token);
                    if (parts.length > 1) {
                        removed += (parts.length - 1);
                        next = parts.join("");
                    }
                }
                lines[i] = next;
            }
            return { content: lines.join(sep), removed };
        }

        function buildChecksConfig() {
            return {
                sensitive: el.checkSensitive.checked,
                overHour: el.checkOverHour.checked,
                duplicate: el.checkDup.checked,
                symbol: el.checkSymbol.checked,
                blank: el.checkBlank.checked,
                srtVsVideo: el.checkSrtVsVideo.checked
            };
        }

        function validateChecksAndInputs(config) {
            if (Object.values(config).filter(Boolean).length === 0) {
                el.srtSummary.innerHTML = `<div class="summary"><span class="err">请至少勾选一项检查。</span></div>`;
                alert("请至少勾选一项检查。");
                return false;
            }
            if (config.sensitive && parseWordList(el.sensitiveWordsInput.value).length === 0) {
                el.srtSummary.innerHTML = `<div class="summary"><span class="err">敏感词词库为空。</span></div>`;
                alert("敏感词词库为空。");
                return false;
            }
            if (config.symbol && parseWordList(el.symbolWordsInput.value).length === 0) {
                el.srtSummary.innerHTML = `<div class="summary"><span class="err">多余符号词库为空。</span></div>`;
                alert("多余符号词库为空。");
                return false;
            }
            return true;
        }

        async function runSrtCheck() {
            if (state.isSrtChecking) return;
            state.isSrtChecking = true;
            el.runSrtBtn.disabled = true;
            try {
                el.srtSummary.innerHTML = `<div class="summary">SRT检查已开始...</div>`;
                if (state.srtFiles.length === 0) {
                    el.srtSummary.innerHTML = `<div class="summary"><span class="err">请先上传SRT文件。</span></div>`;
                    alert("请先上传SRT文件。");
                    return;
                }
                const checks = buildChecksConfig();
                if (!validateChecksAndInputs(checks)) return;
                resetSrtResultArea();

                const sensitiveWords = checks.sensitive ? parseWordList(el.sensitiveWordsInput.value) : [];
                const symbolWords = checks.symbol ? parseWordList(el.symbolWordsInput.value) : [];
                const dupThresholdSource = el.dupThreshold ? el.dupThreshold.value : 0.9;
                const dupThreshold = Math.max(0.5, Math.min(1, parseNumber(dupThresholdSource, 0.9)));
                const failedFiles = [];

                el.srtSummary.innerHTML = `<div class="summary">正在检查 ${state.srtFiles.length} 集...</div>`;

                for (let idx = 0; idx < state.srtFiles.length; idx++) {
                    const file = state.srtFiles[idx];
                    el.srtSummary.innerHTML = `<div class="summary">正在检查 ${idx + 1}/${state.srtFiles.length}：${esc(file.name)}</div>`;
                    try {
                        const content = await decodeSrtText(file);
                        const parsed = parseSrt(content);
                        const episodeKey = extractEpisodeKey(file.name);

                        state.analyses.push({
                            fileName: file.name,
                            episodeKey,
                            originalContent: content,
                            entries: parsed.entries,
                            checks,
                            overHourHits: checks.overHour ? detectOverHour(parsed.entries) : [],
                            duplicateHits: checks.duplicate ? detectAdjacentDuplicates(parsed.entries, dupThreshold) : [],
                            symbolHits: checks.symbol ? detectSymbols(parsed.entries, symbolWords) : [],
                            sensitiveHits: checks.sensitive ? detectSensitive(parsed.entries, sensitiveWords) : [],
                            blankHits: checks.blank ? detectBlankLines(parsed.entries) : [],
                            srtVsVideo: checks.srtVsVideo ? detectSrtLongerThanVideo(parsed.entries, episodeKey) : { skipped: false, reason: "", items: [] }
                        });
                    } catch (err) {
                        failedFiles.push({
                            name: file && file.name ? file.name : "(未知)",
                            reason: err && err.message ? err.message : String(err)
                        });
                    }
                }

                renderSrtSummaryAndTabs(checks);
                if (failedFiles.length > 0) {
                    const lines = failedFiles.map((x) => `${esc(x.name)}: ${esc(x.reason)}`).join("<br/>");
                    el.srtSummary.innerHTML += `<div class="summary"><span class="warn">已跳过 ${failedFiles.length} 个文件：</span><br/>${lines}</div>`;
                }
            } catch (err) {
                console.error(err);
                el.srtSummary.innerHTML = `<div class="summary"><span class="err">运行失败：${esc(err && err.message ? err.message : err)}</span></div>`;
            } finally {
                state.isSrtChecking = false;
                el.runSrtBtn.disabled = false;
            }
        }

        function renderSrtSummaryAndTabs(checks) {
            const total = state.analyses.length;
            const countSensitive = checks.sensitive ? state.analyses.filter((a) => a.sensitiveHits.length > 0).length : 0;
            const countOverHour = checks.overHour ? state.analyses.filter((a) => a.overHourHits.length > 0).length : 0;
            const countDup = checks.duplicate ? state.analyses.filter((a) => a.duplicateHits.length > 0).length : 0;
            const countSymbol = checks.symbol ? state.analyses.filter((a) => a.symbolHits.length > 0).length : 0;
            const countBlank = checks.blank ? state.analyses.filter((a) => a.blankHits.length > 0).length : 0;
            const countSrtVsVideo = checks.srtVsVideo ? state.analyses.filter((a) => !a.srtVsVideo.skipped && a.srtVsVideo.items.length > 0).length : 0;
            const skippedSrtVsVideo = checks.srtVsVideo ? state.analyses.filter((a) => a.srtVsVideo.skipped).length : 0;

            let summary = `<div class="summary">共检查 <b>${total}</b> 集；敏感词命中 <b>${countSensitive}</b>，超1小时 <b>${countOverHour}</b>，相邻重复 <b>${countDup}</b>，多余符号 <b>${countSymbol}</b>，空白字幕行 <b>${countBlank}</b>，SRT&gt;视频 <b>${countSrtVsVideo}</b>`;
            if (checks.srtVsVideo && skippedSrtVsVideo > 0) summary += `，未匹配跳过 <b>${skippedSrtVsVideo}</b>`;
            summary += `</div>`;
            el.srtSummary.innerHTML = summary;

            const tabs = [];
            if (checks.sensitive && countSensitive > 0) tabs.push({ key: "sensitive", title: "1 敏感词", count: countSensitive });
            if (checks.overHour && countOverHour > 0) tabs.push({ key: "overHour", title: "2 超1小时", count: countOverHour });
            if (checks.duplicate && countDup > 0) tabs.push({ key: "duplicate", title: "3 相邻重复", count: countDup });
            if (checks.symbol && countSymbol > 0) tabs.push({ key: "symbol", title: "4 多余符号", count: countSymbol });
            if (checks.blank && countBlank > 0) tabs.push({ key: "blank", title: "5 空白字幕行", count: countBlank });
            if (checks.srtVsVideo && countSrtVsVideo > 0) tabs.push({ key: "srtVsVideo", title: "6 SRT > 视频", count: countSrtVsVideo });

            if (tabs.length === 0) {
                el.srtTabWrap.innerHTML = `<div class="summary"><span class="ok">当前勾选项下未发现问题集数。</span></div>`;
                return;
            }

            const firstActive = tabs[0].key;
            const html = [];
            html.push(`<div class="tabbar">`);
            for (const tab of tabs) html.push(`<button class="tabbtn ${tab.key === firstActive ? "active" : ""}" data-tab="${tab.key}">${esc(tab.title)} (${tab.count})</button>`);
            html.push(`</div>`);
            for (const tab of tabs) html.push(`<div class="tab-panel ${tab.key === firstActive ? "active" : ""}" data-panel="${tab.key}">${renderTabPanel(tab.key)}</div>`);
            el.srtTabWrap.innerHTML = html.join("");
            bindTabEvents();
            bindDetailEvents();
        }

        function compareEpisodeKeyNatural(aKey, bKey) {
            const aStr = String(aKey ?? "").trim();
            const bStr = String(bKey ?? "").trim();
            const aNum = /^\d+$/.test(aStr) ? Number(aStr) : NaN;
            const bNum = /^\d+$/.test(bStr) ? Number(bStr) : NaN;
            if (Number.isFinite(aNum) && Number.isFinite(bNum)) return aNum - bNum;
            if (Number.isFinite(aNum) && !Number.isFinite(bNum)) return -1;
            if (!Number.isFinite(aNum) && Number.isFinite(bNum)) return 1;
            return aStr.localeCompare(bStr, "zh-CN", { numeric: true, sensitivity: "base" });
        }

        function getIssueAnalyses(predicate) {
            return state.analyses
                .filter(predicate)
                .slice()
                .sort((a, b) => {
                    const byEpisode = compareEpisodeKeyNatural(a.episodeKey, b.episodeKey);
                    if (byEpisode !== 0) return byEpisode;
                    return String(a.fileName || "").localeCompare(String(b.fileName || ""), "zh-CN", { numeric: true, sensitivity: "base" });
                });
        }

        function renderTabPanel(key) {
            const list = [];
            if (key === "sensitive") {
                for (const a of getIssueAnalyses((x) => x.sensitiveHits.length > 0)) {
                    list.push(`<div class="issue-card"><div class="issue-file">第 ${esc(a.episodeKey)} 集（${esc(a.fileName)}）</div><div class="issue-title">敏感词命中条数：${a.sensitiveHits.length}</div><button class="btn secondary" data-detail-type="sensitive" data-file="${encodeURIComponent(a.fileName)}">查看明细</button></div>`);
                }
            } else if (key === "overHour") {
                for (const a of getIssueAnalyses((x) => x.overHourHits.length > 0)) {
                    list.push(`<div class="issue-card"><div class="issue-file">第 ${esc(a.episodeKey)} 集（${esc(a.fileName)}）</div><div class="issue-title">超1小时条数：${a.overHourHits.length}</div><button class="btn secondary" data-detail-type="overHour" data-file="${encodeURIComponent(a.fileName)}">查看明细</button></div>`);
                }
            } else if (key === "duplicate") {
                for (const a of getIssueAnalyses((x) => x.duplicateHits.length > 0)) {
                    list.push(`<div class="issue-card"><div class="issue-file">第 ${esc(a.episodeKey)} 集（${esc(a.fileName)}）</div><div class="issue-title">相邻重复组数：${a.duplicateHits.length}</div><button class="btn secondary" data-detail-type="duplicate" data-file="${encodeURIComponent(a.fileName)}">查看明细</button></div>`);
                }
            } else if (key === "symbol") {
                for (const a of getIssueAnalyses((x) => x.symbolHits.length > 0)) {
                    list.push(`<div class="issue-card"><div class="issue-file">第 ${esc(a.episodeKey)} 集（${esc(a.fileName)}）</div><div class="issue-title">多余符号命中条数：${a.symbolHits.length}</div><button class="btn secondary" data-detail-type="symbol" data-file="${encodeURIComponent(a.fileName)}">查看明细</button></div>`);
                }
            } else if (key === "blank") {
                for (const a of getIssueAnalyses((x) => x.blankHits.length > 0)) {
                    list.push(`<div class="issue-card"><div class="issue-file">第 ${esc(a.episodeKey)} 集（${esc(a.fileName)}）</div><div class="issue-title">空白字幕行数：${a.blankHits.length}</div><button class="btn secondary" data-detail-type="blank" data-file="${encodeURIComponent(a.fileName)}">查看明细</button></div>`);
                }
            } else if (key === "srtVsVideo") {
                for (const a of getIssueAnalyses((x) => !x.srtVsVideo.skipped && x.srtVsVideo.items.length > 0)) {
                    const item = a.srtVsVideo.items[0];
                    list.push(`<div class="issue-card"><div class="issue-file">第 ${esc(a.episodeKey)} 集（${esc(a.fileName)}）</div><div class="issue-title">SRT结尾 ${toTimecode(item.srtEndMs)}，视频时长 ${toTimecode(item.videoMs)}</div></div>`);
                }
            }
            return list.length > 0 ? list.join("") : `<div class="summary">无记录</div>`;
        }

        function bindTabEvents() {
            const buttons = el.srtTabWrap.querySelectorAll(".tabbtn[data-tab]");
            const panels = el.srtTabWrap.querySelectorAll(".tab-panel[data-panel]");
            for (const btn of buttons) {
                btn.addEventListener("click", () => {
                    const target = btn.getAttribute("data-tab");
                    for (const x of buttons) x.classList.remove("active");
                    for (const p of panels) p.classList.remove("active");
                    btn.classList.add("active");
                    const panel = el.srtTabWrap.querySelector(`.tab-panel[data-panel="${target}"]`);
                    if (panel) panel.classList.add("active");
                });
            }
        }

        function bindDetailEvents() {
            const buttons = el.srtTabWrap.querySelectorAll("button[data-detail-type][data-file]");
            for (const btn of buttons) {
                btn.addEventListener("click", () => {
                    const type = btn.getAttribute("data-detail-type");
                    const fileName = decodeURIComponent(btn.getAttribute("data-file") || "");
                    const a = state.analyses.find((x) => x.fileName === fileName);
                    if (!a) return;
                    if (type === "sensitive") {
                        const html = [];
                        html.push(`<div class="summary">第 ${esc(a.episodeKey)} 集，文件 ${esc(a.fileName)}，敏感词命中条数 ${a.sensitiveHits.length}</div>`);
                        for (const hit of a.sensitiveHits) {
                            html.push(`<div class="mono">#${esc(hit.seq)} ${esc(hit.timeline || "")}</div>`);
                            html.push(`<div class="mono">命中词：${esc((hit.matched || []).join("、"))}</div>`);
                            html.push(`<pre class="block">${esc(hit.block || buildEntryBlock(hit.seq, hit.timeline, [hit.text || ""]))}</pre>`);
                        }
                        showModal("敏感词明细", html.join(""));
                    } else if (type === "overHour") {
                        const html = [];
                        html.push(`<div class="summary">第 ${esc(a.episodeKey)} 集，文件 ${esc(a.fileName)}，超1小时条数 ${a.overHourHits.length}</div>`);
                        for (const hit of a.overHourHits) {
                            html.push(`<div class="mono">#${esc(hit.seq)} ${esc(hit.timeline || `${toTimecode(hit.start)} --> ${toTimecode(hit.end)}`)}</div>`);
                            html.push(`<pre class="block">${esc(hit.block || buildEntryBlock(hit.seq, hit.timeline, hit.textLines || [hit.text || ""]))}</pre>`);
                        }
                        showModal("超1小时明细", html.join(""));
                    } else if (type === "duplicate") {
                        const html = [];
                        html.push(`<div class="summary">第 ${esc(a.episodeKey)} 集，文件 ${esc(a.fileName)}，相邻重复组数 ${a.duplicateHits.length}</div>`);
                        for (const hit of a.duplicateHits) {
                            const modeLabel = hit.mode === "similarity"
                                ? "相似度"
                                : hit.mode === "contains"
                                    ? "包含关系"
                                    : "衔接重复";
                            const label = hit.mode === "edgeOverlap"
                                ? `#${hit.firstSeq} -> #${hit.secondSeq} (${modeLabel}：${hit.overlapText || "-"}，间隔${Math.max(0, Math.round((hit.secondStartMs - hit.firstEndMs) || 0))}ms)`
                                : `#${hit.firstSeq} -> #${hit.secondSeq} (${modeLabel} ${Math.round(hit.ratio * 100)}%)`;
                            const pair = `${hit.firstBlock || buildEntryBlock(hit.firstSeq, hit.firstTimeline, hit.firstTextLines || [hit.firstText || ""])}\n${hit.secondBlock || buildEntryBlock(hit.secondSeq, hit.secondTimeline, hit.secondTextLines || [hit.secondText || ""])}`;
                            html.push(`<div class="mono">${esc(label)}</div>`);
                            html.push(`<pre class="block">${esc(pair)}</pre>`);
                        }
                        showModal("相邻重复明细", html.join(""));
                    } else if (type === "symbol") {
                        const html = [];
                        html.push(`<div class="summary">第 ${esc(a.episodeKey)} 集，文件 ${esc(a.fileName)}，多余符号命中条数 ${a.symbolHits.length}</div>`);
                        for (const hit of a.symbolHits) {
                            html.push(`<div class="mono">#${esc(hit.seq)} ${esc(hit.timeline || "")}</div>`);
                            html.push(`<div class="mono">命中符号：${esc((hit.matched || []).join("、"))}</div>`);
                            html.push(`<pre class="block">${esc(hit.block || buildEntryBlock(hit.seq, hit.timeline, [hit.text || ""]))}</pre>`);
                        }
                        showModal("多余符号明细", html.join(""));
                    } else if (type === "blank") {
                        const html = [];
                        html.push(`<div class="summary">第 ${esc(a.episodeKey)} 集，文件 ${esc(a.fileName)}，空白字幕行数 ${a.blankHits.length}</div>`);
                        for (const hit of a.blankHits) {
                            html.push(`<div class="mono">#${esc(hit.seq)} ${esc(hit.timeline || "")}</div>`);
                            html.push(`<pre class="block">${esc(hit.block || buildEntryBlock(hit.seq, hit.timeline, []))}</pre>`);
                        }
                        showModal("空白字幕行明细", html.join(""));
                    }
                });
            }
        }

        async function runRepair() {
            if (state.analyses.length === 0) {
                alert("请先执行SRT检查。");
                return;
            }
            const doOverHour = el.repairOverHour.checked;
            const doSymbol = el.repairSymbol.checked;
            if (!doOverHour && !doSymbol) {
                alert("请至少勾选一项修复（#2 或 #4）。");
                return;
            }
            const symbolWords = parseWordList(el.symbolWordsInput.value);
            if (doSymbol && symbolWords.length === 0) {
                alert("修复 #4 的符号词库为空。");
                return;
            }

            state.fixedFiles = [];
            for (const a of state.analyses) {
                let content = a.originalContent;
                let changed = false;
                if (doOverHour) {
                    const res = fixOverHourInContent(content);
                    if (res.changed > 0) {
                        content = res.content;
                        changed = true;
                    }
                }
                if (doSymbol) {
                    const res = fixSymbolsInContent(content, symbolWords);
                    if (res.removed > 0) {
                        content = res.content;
                        changed = true;
                    }
                }
                if (changed) {
                    state.fixedFiles.push({ fileName: a.fileName, episodeKey: a.episodeKey, content });
                }
            }

            if (doOverHour) el.repairOverHourStatus.textContent = "状态：已修复";
            if (doSymbol) el.repairSymbolStatus.textContent = "状态：已修复";

            renderFixedList();
            el.downloadFixedBtn.disabled = state.fixedFiles.length === 0;
            if (state.fixedFiles.length === 0) {
                alert("修复完成，但没有生成可下载文件。");
            }
        }

        function renderFixedList() {
            if (state.fixedFiles.length === 0) {
                el.fixedList.innerHTML = `<div class="summary">暂无可下载的修复文件。</div>`;
                return;
            }
            const html = [];
            html.push(`<div class="summary">已生成修复文件：${state.fixedFiles.length} 个。支持单文件直接下载，多文件ZIP打包下载。</div>`);
            for (const f of state.fixedFiles) {
                html.push(`<div class="issue-card"><div class="issue-file">第 ${esc(f.episodeKey)} 集（${esc(f.fileName)}）</div><button class="btn secondary" data-single-download="${encodeURIComponent(f.fileName)}">下载单集</button></div>`);
            }
            el.fixedList.innerHTML = html.join("");
            for (const btn of el.fixedList.querySelectorAll("button[data-single-download]")) {
                btn.addEventListener("click", () => {
                    const fileName = decodeURIComponent(btn.getAttribute("data-single-download") || "");
                    const f = state.fixedFiles.find((x) => x.fileName === fileName);
                    if (f) downloadTextFile(f.fileName, f.content);
                });
            }
        }

        function downloadTextFile(fileName, content) {
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(a.href);
                a.remove();
            }, 0);
        }

        function nextZipName() {
            const now = new Date();
            const yyyy = String(now.getFullYear());
            const mm = String(now.getMonth() + 1).padStart(2, "0");
            const dd = String(now.getDate()).padStart(2, "0");
            const dateKey = `${yyyy}${mm}${dd}`;
            state.zipSessionCounterByDate[dateKey] = (state.zipSessionCounterByDate[dateKey] || 0) + 1;
            const idx = String(state.zipSessionCounterByDate[dateKey]).padStart(3, "0");
            return `SRT修复结果_${dateKey}_${idx}.zip`;
        }

        async function downloadFixedFiles() {
            if (state.fixedFiles.length === 0) {
                alert("没有可下载的修复文件。");
                return;
            }
            if (state.fixedFiles.length === 1) {
                const x = state.fixedFiles[0];
                downloadTextFile(x.fileName, x.content);
                return;
            }
            if (typeof JSZip === "undefined") {
                alert("JSZip未加载，将改为逐个下载。");
                for (let i = 0; i < state.fixedFiles.length; i++) {
                    const x = state.fixedFiles[i];
                    setTimeout(() => downloadTextFile(x.fileName, x.content), i * 120);
                }
                return;
            }
            const zip = new JSZip();
            for (const x of state.fixedFiles) zip.file(x.fileName, x.content);
            const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 9 } });
            const fileName = nextZipName();
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(a.href);
                a.remove();
            }, 0);
        }

        window.__runSrtCheck = runSrtCheck;
        try {
            el.videoWithInput.addEventListener("change", () => {
                state.withVideos = dedupeFiles(filterVideoFiles(el.videoWithInput.files));
                el.videoWithCount.textContent = String(state.withVideos.length);
            });
            el.videoWithoutInput.addEventListener("change", () => {
                state.withoutVideos = dedupeFiles(filterVideoFiles(el.videoWithoutInput.files));
                el.videoWithoutCount.textContent = String(state.withoutVideos.length);
            });
            el.runVideoBtn.addEventListener("click", runVideoCheck);

            el.srtInput.addEventListener("change", () => {
                state.srtFiles = dedupeFiles(filterSrtFiles(el.srtInput.files));
                el.srtCount.textContent = String(state.srtFiles.length);
                resetSrtResultArea();
            });

            [el.checkSensitive, el.checkSymbol].forEach((checkbox) => checkbox.addEventListener("change", updateDynamicInputVisibility));
            el.runSrtBtn.addEventListener("click", runSrtCheck);
            if (el.openGuideBtn) el.openGuideBtn.addEventListener("click", openFeatureGuide);
            el.runRepairBtn.addEventListener("click", runRepair);
            el.downloadFixedBtn.addEventListener("click", downloadFixedFiles);

            el.modalMask.addEventListener("click", (ev) => { if (ev.target === el.modalMask) closeModal(); });
            el.modalCloseBtn.addEventListener("click", closeModal);

            updateDynamicInputVisibility();
            resetSrtResultArea();
            window.__toolBoot = "ok";
            const boot = document.getElementById("bootStatus");
            if (boot) {
                boot.innerHTML = `<span class="ok">启动状态：就绪（${new Date().toLocaleTimeString()}）</span>`;
            }
        } catch (err) {
            console.error(err);
            const box = document.getElementById("srtSummary");
            if (box) {
                box.innerHTML = `<div class="summary"><span class="err">初始化错误：${esc(err && err.message ? err.message : err)}</span></div>`;
            }
            const boot = document.getElementById("bootStatus");
            if (boot) {
                boot.innerHTML = `<span class="err">启动状态：初始化错误（${esc(err && err.message ? err.message : err)}）</span>`;
            }
            window.__toolBoot = "error";
        }
    </script>
</body>
</html>
